                value: { description: Giá trị JSON theo kiểu của key }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Setting' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/v1/audit-logs:
    get:
      tags: [Admin]
      operationId: adminListAuditLogs
      summary: Tra cứu audit log
      x-roles: [CHECKER, ADMIN]
      security: [{ staffBearer: [] }]
      parameters:
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string }, description: 'Ví dụ auth.pin.locked — danh mục ở fsd/09 §1.3' }
        - { name: outcome, in: query, schema: { type: string, enum: [SUCCESS, DENIED, ERROR] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
# ───────────────────────────── Webhooks (wallet → merchant) ─────────────────────────────
webhooks:
  order.paid:
    post:
      tags: [Merchant]
      operationId: webhookOrderPaid
      security: [{ webhookSignature: [] }]
      summary: Đơn hàng đã thanh toán
      description: |
        Gửi tới `callback_url` của merchant. Header `X-Event-Id`, `X-Timestamp`, `X-Signature` (HMAC-SHA256 với secret của merchant,
        cùng công thức như request merchant → wallet). Merchant phải xử lý idempotent theo `event_id` và trả `2xx`.
        Không phải 2xx/timeout 10s ⇒ retry backoff tối đa 24h (BR-51). Merchant luôn có thể tra cứu `GET /merchant/v1/orders/{id}`.
      x-br: [BR-51]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Merchant đã nhận }
        '4XX': { description: 'Merchant từ chối — wallet ghi nhận và retry theo lịch backoff (tối đa 24h)' }
  order.refunded:
    post:
      tags: [Merchant]
      operationId: webhookOrderRefunded
      security: [{ webhookSignature: [] }]
      summary: Hoàn tiền thành công
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Merchant đã nhận }

        '4XX': { description: 'Merchant từ chối — wallet ghi nhận và retry theo lịch backoff (tối đa 24h)' }
components:
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (Ed25519, 15 phút) do `/v1/auth/*` cấp, gắn với thiết bị. Mọi request `/v1` phải kèm `X-Device-Id`
        trùng thiết bị trong token, nếu không ⇒ `401 DEVICE_NOT_BOUND`.
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token realm back-office (issuer/audience riêng). Role yêu cầu ghi ở `x-roles` của từng operation.
    merchantHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        Kèm `X-Api-Key`, `X-Timestamp` (RFC 3339, lệch ≤ 5 phút).
        `X-Signature = hex(HMAC-SHA256(secret, METHOD + "\n" + PATH_WITH_QUERY + "\n" + X-Timestamp + "\n" + SHA256_HEX(body)))`.

    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        Wallet ký callback gửi merchant: kèm `X-Event-Id`, `X-Timestamp`; công thức như `merchantHmac`, dùng secret của merchant.

  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ChallengeId:
      name: X-Challenge-Id
      in: header
      required: false
      description: Gửi khi thực hiện lại request sau khi đã hoàn tất step-up challenge
      schema: { type: string }
    ChallengePath:
      name: challenge_id
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    KycSessionId:
      name: kyc_session_id
      in: path
      required: true
      schema: { type: string }
    BankLinkId:
      name: bank_link_id
      in: path
      required: true
      schema: { type: string }
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: { type: string }
    DisputeId:
      name: dispute_id
      in: path
      required: true
      schema: { type: string }
    WalletId:
      name: wallet_id
      in: path
      required: true
      schema: { type: string }
    AdjustmentId:
      name: adjustment_id
      in: path
      required: true
      schema: { type: string }
    MerchantOrderId:
      name: merchant_order_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }

  requestBodies:
    ReasonRequired:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { $ref: '#/components/schemas/Reason' }

  responses:
    PaymentCreated:
      description: Giao dịch đồng bộ đã hoàn tất (`SUCCEEDED`) — hoặc phát lại response cũ theo Idempotency-Key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Payment' }
          example:
            payment_id: txn_0192a3b4c5d6e7f8
            type: TRANSFER
            status: SUCCEEDED
            amount: 200000
            fee: 0
            currency: VND
            counterparty: { kind: WALLET, display_name: 'NGUYEN V*** B', reference: '+8490****567' }
            description: Tra tien com
            created_at: '2026-10-17T03:15:00Z'
            completed_at: '2026-10-17T03:15:00Z'
    PaymentAccepted:
      description: Đã ghi nhận, đang xử lý với ngân hàng (`PENDING`). Poll `GET /v1/payments/{id}` hoặc chờ push.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Payment' }
          example:
            payment_id: txn_0192a3b4c5d6e7f9
            type: TOPUP
            status: PENDING
            amount: 500000
            fee: 0
            currency: VND
            counterparty: { kind: BANK, display_name: Vietcombank, reference: '****1234' }
            created_at: '2026-10-17T03:15:00Z'
    BadRequest:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: UNAUTHENTICATED / DEVICE_NOT_BOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnauthorizedOrStepUp:
      description: UNAUTHENTICATED, PIN_INVALID, hoặc STEP_UP_REQUIRED (kèm challenge)
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/StepUpRequired'
              - $ref: '#/components/schemas/Error'
          examples:
            stepUp:
              value:
                error: STEP_UP_REQUIRED
                message: Giao dịch cần xác thực OTP và khuôn mặt
                challenge_id: chl_0192a3b4c5d6
                methods: [OTP, FACE]
                expires_at: '2026-10-17T03:20:00Z'
                request_id: 3f1c2a9e-0b7d-4c55-9d2e-8a6f0e4b1c11
            pinInvalid:
              value:
                error: PIN_INVALID
                message: Mã PIN không đúng
                details: { remaining_attempts: 3 }
                request_id: 3f1c2a9e-0b7d-4c55-9d2e-8a6f0e4b1c12
    Forbidden:
      description: FORBIDDEN / ONBOARDING_INCOMPLETE / WALLET_NOT_ACTIVE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: IDEMPOTENCY_IN_PROGRESS / STATE_CONFLICT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Lỗi nghiệp vụ — xem `x-error-codes`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            insufficientFunds:
              value:
                error: INSUFFICIENT_FUNDS
                message: Số dư khả dụng không đủ
                details: { available: 150000, requested: 200000 }
                request_id: 3f1c2a9e-0b7d-4c55-9d2e-8a6f0e4b1c13
            limitExceeded:
              value:
                error: LIMIT_EXCEEDED
                message: Vượt hạn mức giao dịch tháng
                details: { limit_type: MONTH_GENERAL, limit: 100000000, used: 99500000, remaining: 500000 }
                request_id: 3f1c2a9e-0b7d-4c55-9d2e-8a6f0e4b1c14
    Locked:
      description: PIN_LOCKED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: RATE_LIMITED
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- primitives ----------
    Amount:
      type: integer
      format: int64
      minimum: 1
      description: Số tiền theo đồng
    Currency:
      type: string
      enum: [VND]
      default: VND
    Phone:
      type: string
      pattern: '^\+84[0-9]{9,10}$'
      example: '+84901234567'
    Pin:
      type: string
      pattern: '^[0-9]{6}$'
      writeOnly: true
    Otp:
      type: string
      pattern: '^[0-9]{6}$'
      writeOnly: true
    Reason:
      type: string
      minLength: 10
      maxLength: 1000
      description: Lý do bắt buộc cho thao tác của nhân viên (ghi audit)
    NextCursor:
      type: [string, 'null']
    Error:
      type: object
      required: [error, message, request_id]
      properties:
        error: { type: string, description: Mã lỗi trong `x-error-codes` }
        message: { type: string, description: Thông điệp hiển thị được (tiếng Việt) }
        details: { type: object, additionalProperties: true }
        request_id: { type: string }
    StepUpRequired:
      type: object
      required: [error, message, challenge_id, methods, expires_at, request_id]
      properties:
        error: { type: string, const: STEP_UP_REQUIRED }
        message: { type: string }
        challenge_id: { type: string }
        methods:
          type: array
          items: { type: string, enum: [OTP, FACE] }
        expires_at: { type: string, format: date-time }
        request_id: { type: string }

    # ---------- auth / profile ----------
    DeviceInfo:
      type: object
      required: [device_id, fingerprint, platform]
      properties:
        device_id: { type: string, format: uuid, description: Do app sinh và lưu secure storage; trùng X-Device-Id }
        fingerprint: { type: string }
        platform: { type: string, enum: [ANDROID, IOS] }
        model: { type: string }
        app_version: { type: string }
        push_token: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: 'Giây, mặc định 900' }
        customer: { $ref: '#/components/schemas/Customer' }
    StaffTokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        staff:
          type: object
          properties:
            staff_id: { type: string }
            email: { type: string }
            display_name: { type: string }
            roles:
              type: array
              items: { type: string, enum: [SUPPORT, OPERATOR, CHECKER, ADMIN] }
    Customer:
      type: object
      required: [customer_id, phone, onboarding_status, next_steps]
      properties:
        customer_id: { type: string, example: cus_0192a3b4c5d6 }
        phone: { $ref: '#/components/schemas/Phone' }
        full_name: { type: [string, 'null'] }
        date_of_birth: { type: [string, 'null'], format: date }
        onboarding_status:
          type: string
          enum: [REGISTERED, KYC_PENDING, KYC_VERIFIED, KYC_REJECTED, MANUAL_REVIEW]
        has_pin: { type: boolean }
        id_expiry_date: { type: [string, 'null'], format: date }
        next_steps:
          type: array
          description: Các bước onboarding còn thiếu để ví ACTIVE (BR-05)
          items: { type: string, enum: [ACCEPT_CONSENTS, SET_PIN, COMPLETE_KYC, LINK_BANK, RE_KYC] }
    ConsentType:
      type: string
      enum: [TERMS, PERSONAL_DATA, BIOMETRIC_DATA, DATA_SHARING_BANK]
    Consent:
      type: object
      required: [consent_type, policy_version, granted_at]
      properties:
        consent_type: { $ref: '#/components/schemas/ConsentType' }
        policy_version: { type: string }
        granted_at: { type: string, format: date-time }
        withdrawn_at: { type: [string, 'null'], format: date-time }

    # ---------- KYC ----------
    KycStatus:
      type: string
      enum: [CREATED, DOCUMENTS_UPLOADED, PROCESSING, RETRYABLE_ERROR, APPROVED, REJECTED, MANUAL_REVIEW, EXPIRED]
    KycSession:
      type: object
      required: [kyc_session_id, purpose, status, uploaded, expires_at]
      properties:
        kyc_session_id: { type: string, example: kyc_0192a3b4c5d6 }
        purpose: { type: string, enum: [ONBOARDING, RE_KYC] }
        status: { $ref: '#/components/schemas/KycStatus' }
        attempt_no: { type: integer }
        attempts_remaining_today: { type: integer }
        uploaded:
          type: array
          items: { type: string, enum: [ID_FRONT, ID_BACK, SELFIE, LIVENESS_VIDEO, CHIP_DATA] }
        required_documents:
          type: array
          items: { type: string, enum: [ID_FRONT, ID_BACK, SELFIE, LIVENESS_VIDEO, CHIP_DATA] }
        reject_reason:
          type: [string, 'null']
          enum: [OCR_UNREADABLE, ID_EXPIRED, UNDERAGE, LIVENESS_FAILED, FACE_MISMATCH, CHIP_MISMATCH, ID_ALREADY_REGISTERED, null]
        extracted:
          type: [object, 'null']
          description: Thông tin trích xuất (đã che số CCCD) để người dùng xác nhận
          properties:
            full_name: { type: string }
            date_of_birth: { type: string, format: date }
            id_number_masked: { type: string, example: '0010******89' }
            expiry_date: { type: string, format: date }
        expires_at: { type: string, format: date-time }
    AdminKycSession:
      allOf:
        - $ref: '#/components/schemas/KycSession'
        - type: object
          properties:
            customer_id: { type: string }
            checks:
              type: array
              items:
                type: object
                properties:
                  check_type: { type: string, enum: [OCR, LIVENESS, FACE_MATCH, CHIP_VERIFY, AGE, DUPLICATE_ID] }
                  provider: { type: string }
                  attempt: { type: integer }
                  result: { type: string, enum: [PASS, FAIL, ERROR] }
                  score: { type: [number, 'null'] }
                  error_code: { type: [string, 'null'] }
                  created_at: { type: string, format: date-time }
            documents:
              type: array
              items:
                type: object
                properties:
                  document_id: { type: string }
                  kind: { type: string }
                  mime_type: { type: string }
                  size_bytes: { type: integer }

    # ---------- wallet ----------
    WalletStatus:
      type: string
      enum: [INACTIVE, ACTIVE, SUSPENDED, FROZEN, CLOSED]
    Wallet:
      type: object
      required: [wallet_id, status, currency, available_balance, held_balance, total_balance]
      properties:
        wallet_id: { type: string, example: wal_0192a3b4c5d6 }
        status: { $ref: '#/components/schemas/WalletStatus' }
        status_reason:
          type: [string, 'null']
          enum: [ID_EXPIRED, FRAUD_SUSPECTED, RECON_MISMATCH, CUSTOMER_REQUEST, AUTHORITY_REQUEST, DORMANT, null]
        currency: { $ref: '#/components/schemas/Currency' }
        available_balance: { type: integer, format: int64, description: Có thể chi tiêu }
        held_balance: { type: integer, format: int64, description: Đang giữ cho rút/chuyển ngân hàng chưa xong }
        total_balance: { type: integer, format: int64, description: available + held }
        created_at: { type: string, format: date-time }
    WalletLimits:
      type: object
      required: [period, month_general, per_transaction, strong_auth]
      properties:
        period: { type: string, example: '2026-10', description: 'Tháng dương lịch, giờ VN' }
        month_general:
          $ref: '#/components/schemas/LimitUsage'
        month_essential:
          $ref: '#/components/schemas/LimitUsage'
        per_transaction:
          type: object
          properties:
            min_transfer: { type: integer, format: int64 }
            min_topup: { type: integer, format: int64 }
            max: { type: integer, format: int64 }
        strong_auth:
          type: object
          description: Ngưỡng cần OTP + khuôn mặt (BR-36)
          properties:
            single_threshold: { type: integer, format: int64 }
            daily_threshold: { type: integer, format: int64 }
            today_own_account_total: { type: integer, format: int64 }
            today_other_total: { type: integer, format: int64 }
        new_device_restriction:
          type: [object, 'null']
          description: Có giá trị trong 24h đầu sau khi đổi thiết bị (BR-38)
          properties:
            daily_limit: { type: integer, format: int64 }
            until: { type: string, format: date-time }
    LimitUsage:
      type: object
      required: [limit, used, remaining]
      properties:
        limit: { type: integer, format: int64 }
        used: { type: integer, format: int64 }
        remaining: { type: integer, format: int64 }
    Activity:
      type: object
      required: [payment_id, type, direction, amount, currency, status, occurred_at]
      properties:
        payment_id: { type: string }
        type: { $ref: '#/components/schemas/PaymentType' }
        direction: { type: string, enum: [IN, OUT] }
        amount: { type: integer, format: int64 }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        counterparty_display: { type: string }
        description: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }
    RecipientLookup:
      type: object
      required: [wallet_id, display_name]
      properties:
        wallet_id: { type: string }
        display_name: { type: string, example: 'NGUYEN V*** B' }
        phone_masked: { type: string, example: '+8490****567' }

    # ---------- bank ----------
    Bank:
      type: object
      required: [bank_code, name, supports]
      properties:
        bank_code: { type: string, example: VCB }
        name: { type: string, example: Vietcombank }
        short_name: { type: string }
        logo_url: { type: string, format: uri }
        supports:
          type: array
          items: { type: string, enum: [LINK_ACCOUNT, LINK_DEBIT_CARD, INTERBANK_DESTINATION] }
    BankLink:
      type: object
      required: [bank_link_id, bank_code, source_type, number_masked, status, is_default]
      properties:
        bank_link_id: { type: string, example: lnk_0192a3b4c5d6 }
        bank_code: { type: string }
        bank_name: { type: string }
        source_type: { type: string, enum: [ACCOUNT, DEBIT_CARD] }
        number_masked: { type: string, example: '****1234' }
        holder_name: { type: string }
        status: { type: string, enum: [PENDING, OTP_SENT, VERIFIED, FAILED, REVOKED] }
        failure_code: { type: [string, 'null'] }
        is_default: { type: boolean }
        otp_expires_at: { type: [string, 'null'], format: date-time }
        verified_at: { type: [string, 'null'], format: date-time }

    # ---------- payments ----------
    PaymentType:
      type: string
      enum: [TOPUP, TRANSFER, WITHDRAW, INTERBANK, QR_PAYMENT, REFUND, ADJUSTMENT]
    PaymentStatus:
      type: string
      description: Trạng thái hiển thị cho khách hàng (NEEDS_RECONCILIATION hiển thị là PENDING)
      enum: [PENDING, SUCCEEDED, FAILED, REVERSED]
    PaymentStatusInternal:
      type: string
      enum: [CREATED, PENDING, SUCCEEDED, FAILED, NEEDS_RECONCILIATION, REVERSED]
    Payment:
      type: object
      required: [payment_id, type, status, amount, fee, currency, created_at]
      properties:
        payment_id: { type: string, example: txn_0192a3b4c5d6 }
        type: { $ref: '#/components/schemas/PaymentType' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { $ref: '#/components/schemas/Amount' }
        fee: { type: integer, format: int64, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        direction: { type: string, enum: [IN, OUT], description: Theo góc nhìn khách hàng đang xem }
        counterparty:
          type: object
          properties:
            kind: { type: string, enum: [WALLET, BANK, MERCHANT] }
            display_name: { type: string }
            reference: { type: string, description: SĐT đã che / 4 số cuối TK / mã đơn }
        description: { type: [string, 'null'] }
        failure_code: { type: [string, 'null'], examples: [BANK_REJECTED_INSUFFICIENT_FUNDS, BANK_REJECTED_LINK_REVOKED] }
        failure_message: { type: [string, 'null'] }
        refund_of: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    TopupRequest:
      type: object
      required: [bank_link_id, amount, currency, pin]
      properties:
        bank_link_id: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        pin: { $ref: '#/components/schemas/Pin' }
    TransferRequest:
      type: object
      required: [recipient, amount, currency, pin]
      properties:
        recipient:
          type: object
          description: Chỉ định đúng một trong hai
          oneOf:
            - required: [wallet_id]
            - required: [phone]
          properties:
            wallet_id: { type: string }
            phone: { $ref: '#/components/schemas/Phone' }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string, maxLength: 140 }
        pin: { $ref: '#/components/schemas/Pin' }
    WithdrawalRequest:
      type: object
      required: [bank_link_id, amount, currency, pin]
      properties:
        bank_link_id: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        pin: { $ref: '#/components/schemas/Pin' }
    InterbankTransferRequest:
      type: object
      required: [dest_bank_code, dest_account_number, amount, currency, pin]
      properties:
        dest_bank_code: { type: string }
        dest_account_number: { type: string, maxLength: 34 }
        dest_holder_name: { type: string, description: 'Nếu gửi, ngân hàng đích kiểm tra khớp' }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string, maxLength: 140 }
        pin: { $ref: '#/components/schemas/Pin' }
    QrInfo:
      type: object
      required: [order_ref, merchant, amount, currency, status, expires_at]
      properties:
        order_ref: { type: string, description: Mã đơn nội bộ (ord_…) dùng khi thanh toán }
        merchant:
          type: object
          properties:
            merchant_id: { type: string }
            display_name: { type: string }
            category: { type: string, enum: [GENERAL, ESSENTIAL] }
        merchant_order_id: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        expires_at: { type: string, format: date-time }
    QrPaymentRequest:
      type: object
      required: [order_ref, amount, currency, pin]
      properties:
        order_ref: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        pin: { $ref: '#/components/schemas/Pin' }

    # ---------- challenges ----------
    Challenge:
      type: object
      required: [challenge_id, purpose, status, required_methods, completed_methods, expires_at]
      properties:
        challenge_id: { type: string }
        purpose: { type: string, enum: [TRANSACTION, NEW_DEVICE, PIN_RESET, CHANGE_PHONE] }
        status: { type: string, enum: [PENDING, VERIFIED, CONSUMED, EXPIRED, FAILED] }
        required_methods:
          type: array
          items: { type: string, enum: [OTP, FACE] }
        completed_methods:
          type: array
          items: { type: string, enum: [OTP, FACE] }
        otp_sent_to: { type: string, example: '+8490****567' }
        remaining_attempts: { type: integer }
        expires_at: { type: string, format: date-time }

    # ---------- disputes ----------
    DisputeType:
      type: string
      enum: [WRONG_RECIPIENT, NOT_RECEIVED, DUPLICATE_CHARGE, UNAUTHORIZED, OTHER]
    DisputeStatus:
      type: string
      enum: [SUBMITTED, IN_REVIEW, WAITING_CUSTOMER, RESOLVED_ACCEPTED, RESOLVED_REJECTED]
    Dispute:
      type: object
      required: [dispute_id, payment_id, type, status, submitted_at, due_at]
      properties:
        dispute_id: { type: string, example: dsp_0192a3b4c5d6 }
        payment_id: { type: string }
        type: { $ref: '#/components/schemas/DisputeType' }
        description: { type: string }
        status: { $ref: '#/components/schemas/DisputeStatus' }
        resolution: { type: [string, 'null'] }
        submitted_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- merchant ----------
    OrderStatus:
      type: string
      enum: [CREATED, PAID, EXPIRED, CANCELLED, PARTIALLY_REFUNDED, REFUNDED]
    CreateOrderRequest:
      type: object
      required: [merchant_order_id, amount, currency]
      properties:
        merchant_order_id: { type: string, maxLength: 64 }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string, maxLength: 140 }
    Order:
      type: object
      required: [order_ref, merchant_order_id, amount, currency, status, expires_at]
      properties:
        order_ref: { type: string, example: ord_0192a3b4c5d6 }
        merchant_order_id: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        qr_token:
          type: string
          description: Chỉ trả khi tạo đơn. Token ngẫu nhiên 128-bit; server chỉ lưu hash (BR-52)
        qr_content:
          type: string
          description: Chuỗi để render QR — chỉ chứa token
          example: 'ewallet://pay?t=Qk3x9mZ0aT1bVvYwPq7rS2'
        expires_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        payment_id: { type: [string, 'null'] }
        refunded_amount: { type: integer, format: int64 }
    Refund:
      type: object
      required: [merchant_refund_id, amount, currency, status]
      properties:
        merchant_refund_id: { type: string }
        order_ref: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED] }
        payment_id: { type: [string, 'null'] }
        failure_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    WebhookEvent:
      type: object
      required: [event_id, event_type, occurred_at, data]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string, enum: [order.paid, order.refunded] }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          required: [order]
          properties:
            order: { $ref: '#/components/schemas/Order' }
            refund: { $ref: '#/components/schemas/Refund' }

    # ---------- admin ----------
    AdminCustomer:
      type: object
      properties:
        customer_id: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        full_name: { type: [string, 'null'] }
        onboarding_status: { type: string }
        wallet_id: { type: [string, 'null'] }
        wallet_status: { $ref: '#/components/schemas/WalletStatus' }
        created_at: { type: string, format: date-time }
    AdminCustomerDetail:
      type: object
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        id_number_masked: { type: [string, 'null'] }
        wallet: { $ref: '#/components/schemas/Wallet' }
        limits: { $ref: '#/components/schemas/WalletLimits' }
        bank_links:
          type: array
          items: { $ref: '#/components/schemas/BankLink' }
        devices:
          type: array
          items:
            type: object
            properties:
              device_id: { type: string }
              platform: { type: string }
              model: { type: string }
              status: { type: string, enum: [ACTIVE, REVOKED] }
              bound_at: { type: string, format: date-time }
        consents:
          type: array
          items: { $ref: '#/components/schemas/Consent' }
        open_aml_alerts: { type: integer }
        open_disputes: { type: integer }
    AdminPayment:
      type: object
      properties:
        payment_id: { type: string }
        type: { $ref: '#/components/schemas/PaymentType' }
        status: { $ref: '#/components/schemas/PaymentStatusInternal' }
        customer_id: { type: string }
        amount: { type: integer, format: int64 }
        fee: { type: integer, format: int64 }
        currency: { $ref: '#/components/schemas/Currency' }
        auth_level: { type: string, enum: [PIN, OTP_FACE] }
        limit_category: { type: string, enum: [NONE, GENERAL, ESSENTIAL] }
        failure_code: { type: [string, 'null'] }
        pending_since: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        request_id: { type: string }
    AdminPaymentDetail:
      allOf:
        - $ref: '#/components/schemas/AdminPayment'
        - type: object
          properties:
            source_wallet_id: { type: [string, 'null'] }
            dest_wallet_id: { type: [string, 'null'] }
            bank_link_id: { type: [string, 'null'] }
            merchant_id: { type: [string, 'null'] }
            order_ref: { type: [string, 'null'] }
            status_history:
              type: array
              items:
                type: object
                properties:
                  from_status: { type: [string, 'null'] }
                  to_status: { type: string }
                  reason_code: { type: [string, 'null'] }
                  actor_type: { type: string }
                  actor_id: { type: [string, 'null'] }
                  at: { type: string, format: date-time }
            bank_operation:
              type: [object, 'null']
              properties:
                bank_operation_id: { type: string, format: uuid }
                type: { type: string }
                status: { type: string, enum: [PENDING, SENT, SUCCEEDED, REJECTED, UNKNOWN, NEEDS_RECONCILIATION] }
                corebank_ref: { type: [string, 'null'] }
                reason_code: { type: [string, 'null'] }
                attempts:
                  type: array
                  items:
                    type: object
                    properties:
                      attempt_no: { type: integer }
                      kind: { type: string, enum: [SUBMIT, QUERY] }
                      outcome: { type: string }
                      http_status: { type: [integer, 'null'] }
                      latency_ms: { type: integer }
                      at: { type: string, format: date-time }
            ledger_entries:
              type: array
              items:
                type: object
                properties:
                  ledger_txn_id: { type: string }
                  kind: { type: string }
                  account_code: { type: string }
                  direction: { type: string, enum: [D, C] }
                  amount: { type: integer, format: int64 }
                  at: { type: string, format: date-time }
    ReconRun:
      type: object
      properties:
        recon_run_id: { type: string }
        business_date: { type: string, format: date }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        safeguard_bank_balance: { type: [integer, 'null'], format: int64 }
        safeguard_ledger_balance: { type: [integer, 'null'], format: int64 }
        total_liabilities: { type: [integer, 'null'], format: int64 }
        invariant_ok: { type: [boolean, 'null'] }
        matched_count: { type: integer }
        mismatch_count: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    ReconResolutionStatus:
      type: string
      enum: [OPEN, AUTO_RESOLVED, ADJUSTMENT_PENDING, RESOLVED, WRITTEN_OFF]
    ReconItem:
      type: object
      properties:
        recon_item_id: { type: string }
        kind: { type: string, enum: [MISSING_IN_WALLET, MISSING_IN_BANK, AMOUNT_MISMATCH, STATUS_MISMATCH, STUCK_PENDING] }
        bank_operation_id: { type: [string, 'null'] }
        corebank_ref: { type: [string, 'null'] }
        payment_id: { type: [string, 'null'] }
        wallet_amount: { type: [integer, 'null'], format: int64 }
        bank_amount: { type: [integer, 'null'], format: int64 }
        resolution_status: { $ref: '#/components/schemas/ReconResolutionStatus' }
        notes: { type: [string, 'null'] }
    AdjustmentStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, POSTED]
    AdjustmentInput:
      type: object
      required: [type, wallet_id, amount, reason]
      properties:
        type:
          type: string
          enum: [COMPENSATE_CREDIT, REVERSAL, SUSPENSE_RECOVERY]
          description: Theo ma trận bút toán erd §3.2 dòng 7
        wallet_id: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        recon_item_id: { type: string }
        dispute_id: { type: string }
        payment_id: { type: string, description: Giao dịch gốc (với REVERSAL) }
        reason: { $ref: '#/components/schemas/Reason' }
    Adjustment:
      allOf:
        - $ref: '#/components/schemas/AdjustmentInput'
        - type: object
          required: [adjustment_id, status, maker_id, created_at]
          properties:
            adjustment_id: { type: string }
            status: { $ref: '#/components/schemas/AdjustmentStatus' }
            maker_id: { type: string }
            checker_id: { type: [string, 'null'] }
            ledger_txn_id: { type: [string, 'null'] }
            created_at: { type: string, format: date-time }
            decided_at: { type: [string, 'null'], format: date-time }
    AmlAlertStatus:
      type: string
      enum: [OPEN, REVIEWING, CLOSED_FALSE_POSITIVE, ESCALATED, REPORTED]
    AmlAlert:
      type: object
      properties:
        aml_alert_id: { type: string }
        rule_code: { type: string, enum: [EWIRE_THRESHOLD, TOPUP_THEN_DRAIN, FAN_IN, MANUAL] }
        customer_id: { type: string }
        payment_ids:
          type: array
          items: { type: string }
        total_amount: { type: integer, format: int64 }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AmlAlertStatus' }
        assignee_id: { type: [string, 'null'] }
        action_taken: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Setting:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { description: Giá trị JSON }
        description: { type: string }
        updated_by: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        audit_log_id: { type: string }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string, enum: [CUSTOMER, STAFF, MERCHANT, SYSTEM] }
        actor_id: { type: [string, 'null'] }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        outcome: { type: string, enum: [SUCCESS, DENIED, ERROR] }
        reason: { type: [string, 'null'] }
        request_id: { type: string }
        metadata: { type: object, additionalProperties: true }
