openapi: 3.1.0
info:
  title: E-Wallet — wallet-core API
  version: 0.1.0
  summary: API của wallet-core cho app-mobile, merchant và back-office.
  license:
    name: Proprietary — project học tập, không dùng cho tiền thật
    identifier: LicenseRef-Proprietary
  description: |
    Nguồn chuẩn cho hợp đồng giữa **wallet-core** và các client. Liên quan (repo `E-Wallet`): `docs/business-rules.md` (BR-xx), `docs/fsd/` (UC-xx),
    `docs/architecture.md` §7, `docs/erd.md`.

    ## Ba nhóm API
    | Prefix | Client | Security |
    |---|---|---|
    | `/v1` | app-mobile (Flutter) | `customerBearer` + header `X-Device-Id` |
    | `/merchant/v1` | merchant / merchant-sim | `merchantHmac` |
    | `/admin/v1` | back-office-web (React) | `staffBearer` — role yêu cầu ghi ở `x-roles` |

    ## Quy ước chung
    - JSON `snake_case`. Thời gian RFC 3339 (UTC). ID public là chuỗi có prefix (`cus_`, `wal_`, `txn_`, `lnk_`, `ord_`, `chl_`, `kyc_`, `dsp_`…).
    - **Tiền**: `amount` là số nguyên `int64` theo đồng, luôn đi kèm `currency = "VND"`. Không bao giờ dùng số thực.
    - **Correlation**: client nên gửi `X-Request-Id` (UUID); server luôn trả lại `X-Request-Id` và có `request_id` trong body lỗi. Server chỉ nhận id gồm `[A-Za-z0-9._-]`, dài 1–128 ký tự; id khác bị bỏ qua và server sinh id mới (không trả lỗi).
    - **Phân trang**: keyset — query `cursor` + `limit`; response có `next_cursor` (null khi hết).

    ## Idempotency (bắt buộc cho mọi lệnh tạo giao dịch)
    - Header `Idempotency-Key` (≤ 128 ký tự, khuyến nghị UUIDv4), phạm vi theo khách hàng / merchant / staff.
    - Cùng key + cùng payload ⇒ trả **đúng response đã lưu** (kể cả response lỗi nghiệp vụ). Hiệu lực 7 ngày.
    - Cùng key + payload khác ⇒ `422 IDEMPOTENCY_KEY_REUSED`. Request trước còn đang xử lý ⇒ `409 IDEMPOTENCY_IN_PROGRESS`.
    - Trường `pin` **không** tham gia tính hash payload.

    ## Xác thực giao dịch (BR-35…40)
    1. Mọi lệnh tiền gửi kèm `pin` (6 số) trong body.
    2. Nếu cần xác thực mạnh (G > 10 tr hoặc tổng ngày > 20 tr, thiết bị mới…) server trả
       `401 STEP_UP_REQUIRED` + `challenge_id` + `methods` (ví dụ `["OTP","FACE"]`).
    3. Client hoàn tất challenge qua `/v1/challenges/{id}/…`.
    4. Client gửi lại **đúng request đó với cùng `Idempotency-Key`** kèm header `X-Challenge-Id`.
    Challenge gắn với nội dung giao dịch (loại, số tiền, người nhận), dùng một lần, hết hạn sau 5 phút.

    ## Trạng thái giao dịch hiển thị cho khách hàng
    `PENDING` (đang xử lý) · `SUCCEEDED` · `FAILED` · `REVERSED`.
    Trạng thái nội bộ `NEEDS_RECONCILIATION` được hiển thị cho khách là `PENDING` (BR-46); back-office thấy đầy đủ.

    ## Lỗi
    Định dạng thống nhất `Error`. Danh mục mã lỗi ở `x-error-codes`. Lỗi nghiệp vụ dùng `4xx`, chỉ lỗi hệ thống mới là `5xx`.
servers:
  - url: http://localhost:8080
    description: Local (docker compose)

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, token (BR-03, BR-38)
  - name: Profile
    description: Hồ sơ, PIN, đồng ý xử lý dữ liệu (BR-39, BR-70)
  - name: KYC
    description: eKYC mô phỏng (BR-04…08)
  - name: Wallet
    description: Ví, số dư, hạn mức, lịch sử (BR-02, 05, 25…29, 62)
  - name: BankLinks
    description: Liên kết ngân hàng (BR-10…14)
  - name: Payments
    description: Nạp, chuyển, rút, liên ngân hàng (BR-20…24, 45…50)
  - name: QR
    description: Thanh toán QR động (BR-51, 52)
  - name: Challenges
    description: Step-up OTP / khuôn mặt (BR-36, 40)
  - name: Disputes
    description: Tra soát, khiếu nại (BR-60)
  - name: Merchant
    description: API cho merchant (BR-48, 51…53)
  - name: Admin
    description: Back-office (BR-56…64, 74)
  - name: Ops
    description: Health check

x-error-codes:
  VALIDATION_ERROR: { status: 400, description: Request sai định dạng/thiếu trường }
  UNAUTHENTICATED: { status: 401, description: Thiếu/sai/hết hạn access token }
  STEP_UP_REQUIRED: { status: 401, description: Cần hoàn tất challenge OTP/khuôn mặt rồi gửi lại }
  PIN_INVALID: { status: 401, description: Sai PIN; details.remaining_attempts }
  DEVICE_NOT_BOUND: { status: 401, description: X-Device-Id không phải thiết bị active }
  FORBIDDEN: { status: 403, description: Không đủ quyền / sai role }
  ONBOARDING_INCOMPLETE: { status: 403, description: Chưa eKYC hoặc chưa liên kết ngân hàng (BR-05) }
  WALLET_NOT_ACTIVE: { status: 403, description: Ví SUSPENDED/FROZEN/CLOSED }
  NOT_FOUND: { status: 404, description: Không tồn tại hoặc không thuộc quyền truy cập }
  IDEMPOTENCY_IN_PROGRESS: { status: 409, description: Request cùng key đang xử lý }
  STATE_CONFLICT: { status: 409, description: Trạng thái tài nguyên không cho phép thao tác }
  IDEMPOTENCY_KEY_REUSED: { status: 422, description: Cùng key nhưng payload khác }
  INSUFFICIENT_FUNDS: { status: 422, description: Số dư khả dụng không đủ (BR-24) }
  LIMIT_EXCEEDED: { status: 422, description: 'Vượt hạn mức tháng/lần; details.limit_type, details.remaining (BR-25…28)' }
  AMOUNT_OUT_OF_RANGE: { status: 422, description: Dưới mức tối thiểu / trên mức tối đa mỗi lần }
  RECIPIENT_INVALID: { status: 422, description: Ví nhận không tồn tại/không ACTIVE/là chính mình }
  BANK_LINK_INVALID: { status: 422, description: Liên kết không VERIFIED hoặc không thuộc khách hàng }
  BANK_LINK_LIMIT_REACHED: { status: 422, description: Đã đủ 3 liên kết (BR-12) }
  LAST_BANK_LINK: { status: 422, description: Không được hủy liên kết cuối cùng (BR-13) }
  BANK_OWNERSHIP_MISMATCH: { status: 422, description: TK/thẻ không đứng tên chủ ví (BR-10) }
  CREDIT_CARD_NOT_ALLOWED: { status: 422, description: Không liên kết/nạp bằng thẻ tín dụng (BR-11) }
  QR_EXPIRED: { status: 422, description: QR/đơn hàng hết hạn (BR-52) }
  ORDER_ALREADY_PAID: { status: 422, description: Đơn đã thanh toán (BR-51) }
  REFUND_EXCEEDS_PAID: { status: 422, description: Tổng hoàn vượt số đã thanh toán (BR-48) }
  REFUND_WINDOW_CLOSED: { status: 422, description: Quá 90 ngày (BR-48) }
  KYC_REJECTED: { status: 422, description: eKYC không đạt }
  KYC_ATTEMPTS_EXCEEDED: { status: 422, description: Quá 3 lần/ngày (BR-06) }
  UNDERAGE: { status: 422, description: Chưa đủ 18 tuổi (BR-01) }
  ID_ALREADY_REGISTERED: { status: 422, description: CCCD đã gắn khách hàng khác }
  WALLET_NOT_EMPTY: { status: 422, description: Phải rút hết số dư/không còn giao dịch pending trước khi đóng ví (BR-62) }
  DISPUTE_WINDOW_CLOSED: { status: 422, description: Quá 60 ngày (BR-60) }
  CHALLENGE_INVALID: { status: 422, description: Challenge sai/hết hạn/đã dùng/không khớp giao dịch }
  OTP_INVALID: { status: 422, description: Sai OTP; details.remaining_attempts }
  MAKER_CHECKER_VIOLATION: { status: 422, description: Người duyệt trùng người tạo (BR-64) }
  PIN_LOCKED: { status: 423, description: PIN bị khóa; details.locked_until (BR-39) }
  RATE_LIMITED: { status: 429, description: Quá nhiều request; header Retry-After }
  INTERNAL_ERROR: { status: 500, description: Lỗi hệ thống }
  SERVICE_UNAVAILABLE: { status: 503, description: Phụ thuộc tạm không khả dụng }

paths:
  # ───────────────────────────── Ops ─────────────────────────────
  /healthz:
    get:
      tags: [Ops]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        '200': { description: Process sống }
  /readyz:
    get:
      tags: [Ops]
      operationId: readyz
      summary: Readiness probe
      security: []
      responses:
        '200': { description: 'Sẵn sàng (DB, object storage OK)' }
        '503': { description: Chưa sẵn sàng }

  # ───────────────────────────── Auth ─────────────────────────────
  /v1/auth/register/otp:
    post:
      tags: [Auth]
      operationId: requestRegisterOtp
      summary: Gửi OTP tới SĐT để đăng ký
      x-br: [BR-03]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
      responses:
        '202':
          description: Đã gửi OTP (luôn trả 202 kể cả khi SĐT đã đăng ký, để chống dò SĐT)
          content:
            application/json:
              schema:
                type: object
                required: [verification_id, expires_at]
                properties:
                  verification_id: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/register/verify:
    post:
      tags: [Auth]
      operationId: verifyRegisterOtp
      summary: Xác thực OTP, tạo khách hàng (REGISTERED), gắn thiết bị, trả token
      x-br: [BR-03, BR-38]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_id, otp, device]
              properties:
                verification_id: { type: string }
                otp: { $ref: '#/components/schemas/Otp' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '201':
          description: Đăng ký thành công. Bước tiếp theo — consents → đặt PIN → eKYC → liên kết NH.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập bằng SĐT + PIN
      description: |
        Thiết bị khác thiết bị đang active ⇒ `401 STEP_UP_REQUIRED` (OTP + khuôn mặt). Hoàn tất challenge rồi gọi lại
        với `X-Challenge-Id`; thiết bị mới được gắn, thiết bị cũ bị thu hồi, áp hạn mức 24h đầu (BR-38).
      x-br: [BR-38, BR-39]
      security: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, pin, device]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                pin: { $ref: '#/components/schemas/Pin' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/token/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Đổi refresh token lấy cặp token mới (xoay vòng)
      description: Dùng lại refresh token cũ ⇒ thu hồi cả chuỗi token của thiết bị.
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Đăng xuất, thu hồi refresh token của thiết bị
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204': { description: Đã thu hồi refresh token của thiết bị }

        '401': { $ref: '#/components/responses/Unauthorized' }
  # ───────────────────────────── Profile ─────────────────────────────
  /v1/me:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Profile]
      operationId: getMe
      summary: Thông tin khách hàng và các bước onboarding còn thiếu
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/pin:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    put:
      tags: [Profile]
      operationId: setPin
      summary: Đặt PIN lần đầu hoặc đổi PIN
      description: Đổi PIN yêu cầu `current_pin`. Đặt lần đầu chỉ được khi chưa có PIN.
      x-br: [BR-35, BR-39]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_pin]
              properties:
                current_pin: { $ref: '#/components/schemas/Pin' }
                new_pin: { $ref: '#/components/schemas/Pin' }
      responses:
        '204': { description: Đã cập nhật }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/me/pin/reset:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/ChallengeId'
    post:
      tags: [Profile]
      operationId: resetPin
      summary: Đặt lại PIN khi quên/bị khóa cứng — luôn yêu cầu step-up OTP + khuôn mặt
      x-br: [BR-39]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_pin]
              properties:
                new_pin: { $ref: '#/components/schemas/Pin' }
      responses:
        '204': { description: 'Đã đặt lại, mở khóa PIN' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/me/consents:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Profile]
      operationId: listConsents
      summary: Danh sách đồng ý đã cấp và phiên bản điều khoản hiện hành
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Consent' }
                  required_policy_versions:
                    type: object
                    additionalProperties: { type: string }
                    description: Phiên bản điều khoản hiện hành theo từng consent_type
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Profile]
      operationId: grantConsents
      summary: Ghi nhận đồng ý (đồng ý sinh trắc học là mục riêng)
      x-br: [BR-70]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consents]
              properties:
                consents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [consent_type, policy_version]
                    properties:
                      consent_type: { $ref: '#/components/schemas/ConsentType' }
                      policy_version: { type: string }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/me/consents/{consent_type}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - name: consent_type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConsentType' }
    delete:
      tags: [Profile]
      operationId: withdrawConsent
      summary: Rút lại đồng ý
      description: |
        Rút `TERMS`, `PERSONAL_DATA` hoặc `BIOMETRIC_DATA` khiến ví không thể tiếp tục giao dịch;
        app phải cảnh báo và hướng dẫn đóng ví.
      x-br: [BR-70]
      security: [{ customerBearer: [] }]
      responses:
        '204': { description: Đã rút }

        '401': { $ref: '#/components/responses/Unauthorized' }
  # ───────────────────────────── KYC ─────────────────────────────
  /v1/kyc/sessions:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [KYC]
      operationId: createKycSession
      summary: Tạo phiên eKYC
      description: Yêu cầu đã đồng ý `PERSONAL_DATA` và `BIOMETRIC_DATA`.
      x-br: [BR-04, BR-06, BR-07, BR-70]
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, enum: [ONBOARDING, RE_KYC] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/kyc/sessions/{kyc_session_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/KycSessionId'
    get:
      tags: [KYC]
      operationId: getKycSession
      summary: Xem trạng thái phiên eKYC
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycSession' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/kyc/sessions/{kyc_session_id}/documents/{kind}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/KycSessionId'
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [ID_FRONT, ID_BACK, SELFIE, LIVENESS_VIDEO, CHIP_DATA] }
    put:
      tags: [KYC]
      operationId: uploadKycDocument
      summary: Upload ảnh/video/dữ liệu chip (ghi đè nếu upload lại trước khi submit)
      description: Tối đa 10 MB. Định dạng xác định theo magic bytes (JPEG/PNG/MP4; CHIP_DATA là JSON đã ký từ app đọc NFC).
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: Đã lưu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: File quá lớn }

  /v1/kyc/sessions/{kyc_session_id}/submit:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/KycSessionId'
    post:
      tags: [KYC]
      operationId: submitKycSession
      summary: Gửi hồ sơ để xử lý bất đồng bộ (OCR → liveness → face match → chip verify)
      description: Trả `PROCESSING`; client poll `GET` hoặc nhận push. Kết quả cuối APPROVED/REJECTED/MANUAL_REVIEW.
      x-br: [BR-04, BR-06]
      security: [{ customerBearer: [] }]
      responses:
        '202':
          description: Đang xử lý
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── Wallet ─────────────────────────────
  /v1/wallet:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Wallet]
      operationId: getWallet
      summary: Ví của khách hàng, số dư khả dụng / đang giữ, trạng thái
      x-br: [BR-02, BR-05, BR-50]
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/wallet/limits:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Wallet]
      operationId: getWalletLimits
      summary: Hạn mức đã dùng / còn lại
      x-br: [BR-25, BR-26, BR-28, BR-36, BR-38]
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletLimits' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/wallet/activities:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Wallet]
      operationId: listWalletActivities
      summary: Lịch sử giao dịch (keyset, mới nhất trước)
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/PaymentType' }
        - name: direction
          in: query
          schema: { type: string, enum: [IN, OUT] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/wallet/close:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ChallengeId'
    post:
      tags: [Wallet]
      operationId: closeWallet
      summary: Đóng ví — số dư phải bằng 0, không còn giao dịch pending/hold
      x-br: [BR-62]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { $ref: '#/components/schemas/Pin' }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Ví CLOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/wallets/lookup:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Wallet]
      operationId: lookupRecipient
      summary: Tra người nhận theo SĐT trước khi chuyển — chỉ trả tên đã che
      x-br: [BR-23]
      security: [{ customerBearer: [] }]
      parameters:
        - name: phone
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Phone' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientLookup' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── Bank links ─────────────────────────────
  /v1/banks:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [BankLinks]
      operationId: listBanks
      summary: Danh sách ngân hàng hỗ trợ (giả lập)
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bank' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/bank-links:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [BankLinks]
      operationId: listBankLinks
      summary: Danh sách liên kết ngân hàng
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BankLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [BankLinks]
      operationId: createBankLink
      summary: Bắt đầu liên kết TK/thẻ ghi nợ chính chủ — ngân hàng gửi OTP
      description: Yêu cầu eKYC đã KYC_VERIFIED. Họ tên + CCCD lấy từ hồ sơ đã xác minh, client không gửi.
      x-br: [BR-10, BR-11, BR-12, BR-14]
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, source_type, number]
              properties:
                bank_code: { type: string, example: VCB }
                source_type: { type: string, enum: [ACCOUNT, DEBIT_CARD] }
                number: { type: string, description: Số TK hoặc số thẻ ghi nợ }
      responses:
        '201':
          description: OTP đã gửi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankLink' }
        '202':
          description: Ngân hàng chưa phản hồi — liên kết PENDING, client poll GET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankLink' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/bank-links/{bank_link_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/BankLinkId'
    get:
      tags: [BankLinks]
      operationId: getBankLink
      summary: Xem một liên kết ngân hàng (poll khi PENDING)
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankLink' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [BankLinks]
      operationId: deleteBankLink
      summary: Hủy liên kết (không được hủy liên kết cuối cùng khi ví còn hoạt động)
      x-br: [BR-13]
      security: [{ customerBearer: [] }]
      responses:
        '204': { description: Đã hủy }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/bank-links/{bank_link_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/BankLinkId'
    post:
      tags: [BankLinks]
      operationId: confirmBankLink
      summary: Nhập OTP ngân hàng để hoàn tất liên kết
      description: Liên kết đầu tiên VERIFIED + eKYC đạt ⇒ ví chuyển ACTIVE (BR-05).
      x-br: [BR-05, BR-14]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { $ref: '#/components/schemas/Otp' }
      responses:
        '200':
          description: VERIFIED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankLink' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/bank-links/{bank_link_id}/default:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/BankLinkId'
    put:
      tags: [BankLinks]
      operationId: setDefaultBankLink
      summary: Đặt liên kết mặc định
      security: [{ customerBearer: [] }]
      responses:
        '204': { description: OK }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── Payments ─────────────────────────────
  /v1/topups:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ChallengeId'
    post:
      tags: [Payments]
      operationId: createTopup
      summary: Nạp tiền từ nguồn đã liên kết
      description: Bất đồng bộ — trả `202 PENDING`; ví chỉ được ghi có khi ngân hàng xác nhận (BR-49).
      x-br: [BR-20, BR-35, BR-36, BR-37, BR-49]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopupRequest' }
            example: { bank_link_id: lnk_0192a3b4c5d6, amount: 500000, currency: VND, pin: '123456' }
      responses:
        '202': { $ref: '#/components/responses/PaymentAccepted' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/transfers:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ChallengeId'
    post:
      tags: [Payments]
      operationId: createTransfer
      summary: Chuyển tiền ví–ví (đồng bộ, tức thời, không hủy được)
      x-br: [BR-23, BR-24, BR-25, BR-28, BR-29, BR-35, BR-36, BR-47]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
            example:
              recipient: { phone: '+84901234567' }
              amount: 200000
              currency: VND
              description: Tra tien com
              pin: '123456'
      responses:
        '201': { $ref: '#/components/responses/PaymentCreated' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/withdrawals:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ChallengeId'
    post:
      tags: [Payments]
      operationId: createWithdrawal
      summary: Rút tiền về TK/thẻ đã liên kết
      description: Giữ chỗ (hold) số tiền ngay; trả `202 PENDING`. Không tính vào hạn mức tháng (BR-25).
      x-br: [BR-21, BR-28, BR-35, BR-36, BR-37, BR-50]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalRequest' }
      responses:
        '202': { $ref: '#/components/responses/PaymentAccepted' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/interbank-transfers:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ChallengeId'
    post:
      tags: [Payments]
      operationId: createInterbankTransfer
      summary: Chuyển từ ví tới TK ngân hàng bất kỳ
      description: Giữ chỗ số tiền, trả `202 PENDING`. Tính vào hạn mức tháng (BR-25). Gửi kèm thông tin người gửi (BR-22).
      x-br: [BR-22, BR-25, BR-28, BR-35, BR-36, BR-50]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterbankTransferRequest' }
      responses:
        '202': { $ref: '#/components/responses/PaymentAccepted' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/payments/{payment_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Xem chi tiết/trạng thái giao dịch (dùng để poll giao dịch PENDING)
      x-br: [BR-45, BR-46]
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── QR ─────────────────────────────
  /v1/qr/{qr_token}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - name: qr_token
        in: path
        required: true
        schema: { type: string, minLength: 20, maxLength: 64 }
    get:
      tags: [QR]
      operationId: resolveQr
      summary: Lấy thông tin đơn hàng từ token trong QR (không tin dữ liệu trong QR)
      x-br: [BR-52, BR-53]
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrInfo' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/qr-payments:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ChallengeId'
    post:
      tags: [QR]
      operationId: payQr
      summary: Thanh toán đơn hàng QR (đồng bộ)
      description: |
        Số tiền lấy từ đơn hàng phía server; `amount` trong request chỉ để đối chiếu với số tiền người dùng đã thấy —
        lệch ⇒ `409 STATE_CONFLICT`. Mỗi đơn chỉ thanh toán thành công một lần (BR-51).
      x-br: [BR-25, BR-26, BR-35, BR-36, BR-51, BR-52]
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QrPaymentRequest' }
      responses:
        '201': { $ref: '#/components/responses/PaymentCreated' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }

  # ───────────────────────────── Challenges ─────────────────────────────
  /v1/challenges/{challenge_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/ChallengePath'
    get:
      tags: [Challenges]
      operationId: getChallenge
      summary: Xem trạng thái challenge
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/challenges/{challenge_id}/otp:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/ChallengePath'
    post:
      tags: [Challenges]
      operationId: verifyChallengeOtp
      summary: Xác minh OTP của challenge
      description: |
        Với challenge của luồng `login` (thiết bị mới) — client chưa có token; gọi không kèm Authorization,
        challenge được xác định bởi `challenge_id` + `X-Device-Id`.
      security: [{ customerBearer: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { $ref: '#/components/schemas/Otp' }
      responses:
        '200':
          description: Trạng thái challenge sau khi xác minh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/challenges/{challenge_id}/otp/resend:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/ChallengePath'
    post:
      tags: [Challenges]
      operationId: resendChallengeOtp
      summary: Gửi lại OTP của challenge
      security: [{ customerBearer: [] }, {}]
      responses:
        '202': { description: Đã gửi lại (tối đa 3 lần/challenge) }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/challenges/{challenge_id}/face:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/ChallengePath'
    post:
      tags: [Challenges]
      operationId: verifyChallengeFace
      summary: Gửi selfie/liveness để so khớp với khuôn mặt đã eKYC (mock)
      security: [{ customerBearer: [] }, {}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [selfie]
              properties:
                selfie: { type: string, contentMediaType: image/jpeg }
                liveness_video: { type: string, contentMediaType: video/mp4 }
      responses:
        '200':
          description: Trạng thái challenge sau khi xác minh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── Disputes ─────────────────────────────
  /v1/disputes:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Disputes]
      operationId: listMyDisputes
      summary: Danh sách khiếu nại của tôi
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Dispute' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Disputes]
      operationId: createDispute
      summary: Gửi tra soát/khiếu nại (trong 60 ngày kể từ giao dịch)
      x-br: [BR-47, BR-60]
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, type, description]
              properties:
                payment_id: { type: string }
                type: { $ref: '#/components/schemas/DisputeType' }
                description: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/disputes/{dispute_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DisputeId'
    get:
      tags: [Disputes]
      operationId: getMyDispute
      summary: Xem một khiếu nại
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Merchant ─────────────────────────────
  /merchant/v1/orders:
    post:
      tags: [Merchant]
      operationId: merchantCreateOrder
      summary: Tạo đơn hàng + QR động (hết hạn sau 15 phút)
      x-br: [BR-51, BR-52, BR-53]
      security: [{ merchantHmac: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
            example: { merchant_order_id: order_20261017_001, amount: 125000, currency: VND, description: Ve xem phim }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /merchant/v1/orders/{merchant_order_id}:
    parameters:
      - $ref: '#/components/parameters/MerchantOrderId'
    get:
      tags: [Merchant]
      operationId: merchantGetOrder
      summary: Tra cứu trạng thái đơn (dùng khi chưa nhận được callback)
      x-br: [BR-51]
      security: [{ merchantHmac: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /merchant/v1/orders/{merchant_order_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/MerchantOrderId'
    post:
      tags: [Merchant]
      operationId: merchantCancelOrder
      summary: Hủy đơn chưa thanh toán
      security: [{ merchantHmac: [] }]
      responses:
        '200':
          description: CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }

