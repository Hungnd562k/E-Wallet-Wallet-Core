# Local infrastructure for wallet-core. Postgres is exposed on 5433 to avoid
# clashing with a Postgres already running on the host's 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: e-wallet-core-db
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5433:5432"
    volumes:
      - wallet-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30
  e-wallet-core-api:
    image: e-wallet-core-api:latest
    container_name: e-wallet-core-api
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://wallet:wallet@e-wallet-core-db:5432/wallet?sslmode=disable
      LOG_LEVEL: debug
      WORKER_ID: worker-1
      OUTBOX_BATCH_SIZE: 20
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_MAX_ATTEMPTS: 10
    ports:
      - 8080:8080
    depends_on:
      - postgres
  e-wallet-core-worker:
    image: e-wallet-core-worker:latest
    container_name: e-wallet-core-worker
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://wallet:wallet@e-wallet-core-db:5432/wallet?sslmode=disable
      LOG_LEVEL: debug
      WORKER_ID: worker-1
      OUTBOX_BATCH_SIZE: 20
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_MAX_ATTEMPTS: 10
    depends_on:
      - postgres

volumes:
  wallet-pg:

networks:
  wallet-net:
    external: true
    name: e-wallet-network
