# AI PR review. The workflow itself lives in the docs repo so every code repo
# shares it: Hungnd562k/E-Wallet/.github/workflows/ai-review.yml.
# Runs automatically only for PRs into uat/v1.0.0, where a P0/P1 finding fails
# the job and blocks the merge (ADR-23). On any other PR the owner can comment
# "@claude review" for an advisory review.
name: AI review

on:
  pull_request:
    branches: [uat/v1.0.0]
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: Hungnd562k/E-Wallet/.github/workflows/ai-review.yml@main
    with:
      component: wallet-core
      blocking: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
